PACKAGE_NAME="gc550"
PACKAGE_VERSION="0.1.1"

# Only the safety check and the kernel's own build; nothing else runs.
MAKE[0]="sh tools/check-ep-cmd.sh && make -C ${kernel_source_dir} M=${dkms_tree}/${PACKAGE_NAME}/${PACKAGE_VERSION}/build modules"
CLEAN="make -C ${kernel_source_dir} M=${dkms_tree}/${PACKAGE_NAME}/${PACKAGE_VERSION}/build clean"

BUILT_MODULE_NAME[0]="gc550"
DEST_MODULE_LOCATION[0]="/updates/dkms"
AUTOINSTALL="yes"

# vb2 min_queued_buffers needs 6.8; developed and tested on 7.3.
BUILD_EXCLUSIVE_KERNEL_MIN="6.8"
BUILD_EXCLUSIVE_CONFIG="CONFIG_USB CONFIG_VIDEO_DEV CONFIG_VIDEOBUF2_VMALLOC CONFIG_SND_PCM"
